[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen"
version = "0.1.0"
description = "Personal short-video generator for a two-person YouTube channel"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "llama-cpp-python",
]

[project.optional-dependencies]
dev = ["pytest"]
# GPU generation backends. Install on the 4070 box only, and install a
# CUDA build of torch first from the PyTorch index, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu124
# Then:  pip install -e ".[gpu]"
# Version pins matter here: diffusers>=0.35 requires huggingface-hub 1.x, which
# transformers 4.x refuses; transformers 5.x breaks the CogVideoX T5 tokenizer
# load ("tiktoken is required"). This trio is the tested-working combination.
gpu = [
    "torch",
    "diffusers==0.34.0",
    "transformers==4.49.0",
    "huggingface_hub>=0.26,<1.0",
    "tokenizers>=0.20,<0.22",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "imageio",
    "imageio-ffmpeg",
]
# Audio generation backends (4070 box). Install alongside gpu: pip install -e ".[gpu,audio]"
audio = [
    "kokoro>=0.9.4",
    "misaki[en]",
    "soundfile",
    # misaki[en]'s spaCy G2P model. Pinned explicitly so a fresh install doesn't
    # depend on misaki runtime-`pip install`ing it (fails under a service /
    # offline / read-only env).
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
